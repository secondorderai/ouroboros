name: Build Desktop App

on:
  push:
    branches: [ main ]
    paths:
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build.yml"
      - ".github/codex/**"
      - ".github/workflows/codex-team-sdlc*.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths:
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build.yml"
      - ".github/codex/**"
      - ".github/workflows/codex-team-sdlc*.yml"
  workflow_dispatch:

jobs:
  sdlc-checks:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --prefix .github/codex --ignore-scripts
      - run: npm --prefix .github/codex run check
      - run: npm --prefix .github/codex test
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -ignore 'label "blacksmith-' .github/workflows/codex-team-sdlc.yml .github/workflows/codex-team-sdlc-continue.yml .github/workflows/build.yml
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Audit production dependencies
        run: bun audit --prod

      - name: Lint (CLI)
        run: bun run --filter @ouroboros/cli lint

      - name: Typecheck (CLI)
        run: bun run --filter @ouroboros/cli ts-check

      - name: Typecheck (desktop)
        run: bun run --filter @ouroboros/desktop ts-check

      - name: Unit + integration tests (CLI)
        run: bun run --filter @ouroboros/cli test

      - name: Build CLI binary (for desktop E2E)
        working-directory: packages/desktop
        run: bash scripts/build-cli.sh

      - name: Build desktop bundles (for E2E)
        working-directory: packages/desktop
        run: bun run build:vite

      - name: Desktop E2E (Playwright + Electron)
        working-directory: packages/desktop
        run: xvfb-run --auto-servernum bun run test:e2e

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: packages/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: verify
    runs-on: blacksmith-6vcpu-macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Audit production dependencies
        run: bun audit --prod

      - name: Build CLI binary
        working-directory: packages/desktop
        run: bash scripts/build-cli.sh

      - name: Build desktop app (unsigned)
        working-directory: packages/desktop
        run: bun run build:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
